  <style>
    .fav_row_section{
      display: flex;
      flex-direction: row;
      gap: 2.5em;
      margin-bottom: 1em;
    }
  </style>
  <h1 class="section-title">Mis Favoritos</h1>
  <div class="content-card opts-box">
    <h2>Libros</h2>
    <div class="fav_row_section">
      <item-card *ngFor="let fl of favLibros" [imgUrl]="fl.getImagenUrl" [title]="fl.getTitulo"></item-card>
    </div>
    <h2>Autores</h2>
    <div class="fav_row_section">
      <item-card class="horizontal" *ngFor="let fa of favAutores" [imgUrl]="fa.getImagenUrl()"  [title]="fa.getNombre() + ' ' + fa.getApellido() "></item-card>
    </div>
    <h2>Editoriales</h2>
    <div class="fav_row_section">
      <item-card class="horizontal" *ngFor="let fe of favEditoriales" [imgUrl]="fe.getImagenUrl" [title]="fe.getNombre"></item-card>
    </div>
  </div>
