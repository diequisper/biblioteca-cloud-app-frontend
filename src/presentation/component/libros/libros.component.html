  <h1 class="section-title">Libros</h1>
  <app-filters-bar (paramSelected)="filterLibrosByParam($event)"></app-filters-bar>
  <div class="content-card">
    <item-card (click)="toggleDetails(libro)" *ngFor="let libro of libros" [imgUrl]="libro.getImagenUrl" [title]="libro.getTitulo"></item-card>
  </div>
